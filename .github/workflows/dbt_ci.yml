name: dbt CI

on:
  pull_request:
    paths:
      - 'football_intelligence/**'

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/243936908135/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@bangkok-football.iam.gserviceaccount.com

      - name: Install dbt
        run: pip install dbt-bigquery==1.7.0 --index-url https://pypi.org/simple/

      - name: dbt compile
        working-directory: football_intelligence
        run: dbt compile --profiles-dir profiles

      - name: dbt test
        working-directory: football_intelligence
        run: dbt test --profiles-dir profiles
