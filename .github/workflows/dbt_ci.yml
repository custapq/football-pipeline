name: dbt CI

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'football_intelligence/**'

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install dbt-bigquery==1.7.0

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: dbt compile
        working-directory: football_intelligence
        run: dbt compile --profiles-dir ./profiles

      - name: dbt test
        working-directory: football_intelligence
        run: dbt test --profiles-dir ./profiles
